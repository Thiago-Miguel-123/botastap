<div class="container mt-3">
  <h1>Novo Produto</h1>
  <form class="row g-3">
    <div class="col-md-5 col-sm-12">
      <div class="form-floating">
        <label for="nome">Nome do produto</label>
        <input type="text" name="nome" id="nome" required class="form-control" placeholder="digite o nome do produto">
      </div></div>


    <div class="col-md-3 col-sm-12">
      <div class="form-floating">
        <label for="valor">Valor do produto</label>
        <input type="number" name="valor" id="valor" step="0.5" required class="form-control" placeholder="digite o valor do produto">
      </div></div>

    <div class="col-md-3 col-sm-12">
      <div class="form-floating">
        <label for="qtd">Quantidade</label>
        <input type="number" name="qtd" id="qtd" required class="form-control" placeholder="digite a quantidade de produtos">
      </div></div>

    <div class="col-md-4 col-sm-12"> 
      <div class="form-floating">
      <label for="categoria">Categoria</label>
      <select name="categoria" id="categoria" class="form-select">
        <option value="pele">doce</option>
        <option value="osso">sagado</option>
        <option value="carne">agridoce</option>
        <option value="sangue">neutro</option>
      </select>
    </div></div>

    <div class="col-md-4 col-sm-12">
      <label class="form-check form-check-inline">Frabricado em:</label>
      <div class="form-check form-check-inline">
        <label for="sp">SP</label>
        <input type="radio" name="fab" id="sp" class="form-check-input">
      </div>
      <div class="form-check form-check-inline">
        <label for="rj">RJ</label>
        <input type="radio" name="fab" id="rj" class="form-check-input">
      </div>
      <div class="form-check form-check-inline">
        <label for="mg">MG</label>
        <input type="radio" name="fab" id="mg" class="form-check-input">
      </div>
      
    </div>

    <div class="col-md-4 col-sm-12">
      <button type="submit" class="btn btn-success">enviar</button>
    </div>

    </div>
  </form>
</div>
